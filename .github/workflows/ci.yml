name: Test, Build and Publish APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run formatting check, unit tests, and Android lint
        run: ./gradlew spotlessCheck testDebugUnitTest testReleaseUnitTest lintDebug

  build-and-publish:
    name: Build & Publish APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AdFree-Solitaire.apk

      - name: Publish APK to rolling 'latest' GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          NOTES="Automated APK build **v${VERSION_NAME}** (build #${{ github.run_number }}) from branch \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)."

          gh api \
            --method PATCH \
            /repos/${{ github.repository }}/git/refs/tags/latest \
            -f sha="${{ github.sha }}" \
            -F force=true >/dev/null 2>&1 || true

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest AdFree-Solitaire.apk --clobber
            gh release edit latest \
              --title "Ad-Free Solitaire (Latest - v${VERSION_NAME})" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          else
            gh release create latest AdFree-Solitaire.apk \
              --title "Ad-Free Solitaire (Latest - v${VERSION_NAME})" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" \
              --latest
          fi


